<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} | Arena Hub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Battle Arena</a>
        <div>
            {% if session.get('user_id') %}
                <a href="/profile" class="btn btn-outline-light btn-sm">Профиль</a>
                <a href="/logout" class="btn btn-danger btn-sm">Выйти</a>
            {% else %}
                <a href="/login" class="btn btn-outline-primary btn-sm">Войти</a>
                <a href="/register" class="btn btn-primary btn-sm">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
